services:
  db:
    container_name: faker-db
    image: postgres:latest
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./create-multiple-db.sh:/docker-entrypoint-initdb.d/create-multiple-db.sh
    environment:
      POSTGRES_MULTIPLE_DATABASES: faker_customers
      POSTGRES_USER: faker
      POSTGRES_PASSWORD: faker
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faker"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    cpus: "0.5"
    networks:
      - faker-network
  app:
    container_name: faker-app
    build: 
      dockerfile: ./Dockerfile
    networks:
      - faker-network
    depends_on:
      db:
        condition: service_healthy

networks:
  faker-network: {}